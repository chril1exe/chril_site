<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Page not found. The requested page could not be located on this server.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2a2a2a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <meta property="og:title" content="404 Not Found">
    <meta property="og:description" content="The page you're looking for doesn't exist.">
    <meta property="og:type" content="website">
    <title>404 Not Found</title>

    <!-- CSS Styles -->
    <style>
        /* CSS Custom Properties */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent-primary: #007acc;
            --accent-secondary: #ff6b6b;
            --border-color: #e0e0e0;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            
            /* Spacing scale */
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;
            --space-2xl: 4rem;
            
            /* Typography scale */
            --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
            --text-sm: clamp(0.875rem, 0.8rem + 0.375vw, 1rem);
            --text-base: clamp(1rem, 0.9rem + 0.5vw, 1.125rem);
            --text-lg: clamp(1.125rem, 1rem + 0.625vw, 1.25rem);
            --text-xl: clamp(1.25rem, 1.1rem + 0.75vw, 1.5rem);
            --text-2xl: clamp(1.5rem, 1.3rem + 1vw, 2rem);
            --text-3xl: clamp(2rem, 1.7rem + 1.5vw, 3rem);
        }

        /* Dark mode variables */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2a2a2a;
                --text-primary: #ffffff;
                --text-secondary: #cccccc;
                --border-color: #404040;
                --shadow-light: rgba(255, 255, 255, 0.1);
                --gradient-bg: linear-gradient(135deg, #434343 0%, #000000 100%);
            }
        }

        /* Manual theme overrides */
        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --border-color: #404040;
            --shadow-light: rgba(255, 255, 255, 0.1);
            --gradient-bg: linear-gradient(135deg, #434343 0%, #000000 100%);
        }

        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Skip link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 6px;
            background: var(--accent-primary);
            color: white;
            padding: 8px;
            text-decoration: none;
            border-radius: 4px;
            z-index: 100;
        }

        .skip-link:focus {
            top: 6px;
        }

        /* Header */
        header {
            padding: var(--space-sm) var(--space-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: var(--space-xs);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: var(--text-sm);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px var(--shadow-light);
        }

        .theme-toggle:focus {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        /* Main content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
            text-align: center;
        }

        /* 404 Card - inspired by the reference image */
        .error-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: var(--space-2xl);
            box-shadow: 0 10px 30px var(--shadow-light);
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-bottom: var(--space-xl);
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: var(--gradient-bg);
            opacity: 0.05;
            animation: float 6s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(10px, -10px) rotate(1deg); }
            66% { transform: translate(-5px, 5px) rotate(-1deg); }
        }

        /* 404 Text - hand-drawn style like reference */
        .error-number {
            font-size: var(--text-3xl);
            font-weight: 300;
            margin-bottom: var(--space-lg);
            color: var(--text-primary);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            position: relative;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Wavy lines like in reference */
        .wavy-lines {
            margin: var(--space-lg) 0;
            height: 60px;
            position: relative;
        }

        .wavy-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--text-secondary);
            border-radius: 2px;
            opacity: 0.6;
        }

        .wavy-line:nth-child(1) {
            top: 10px;
            animation: wave1 3s ease-in-out infinite;
        }

        .wavy-line:nth-child(2) {
            top: 25px;
            animation: wave2 3s ease-in-out infinite 0.5s;
        }

        .wavy-line:nth-child(3) {
            top: 40px;
            animation: wave3 3s ease-in-out infinite 1s;
        }

        @keyframes wave1 {
            0%, 100% { transform: scaleX(1) translateX(0); }
            50% { transform: scaleX(0.95) translateX(5px); }
        }

        @keyframes wave2 {
            0%, 100% { transform: scaleX(1) translateX(0); }
            50% { transform: scaleX(1.05) translateX(-3px); }
        }

        /* Error message in lines area */
        .error-message-lines {
            margin-top: var(--space-sm);
            font-size: var(--text-sm);
            color: var(--text-secondary);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            line-height: 1.4;
        }

        .error-message-lines p {
            margin: 2px 0;
            opacity: 0.8;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            justify-content: center;
            margin-bottom: var(--space-lg);
        }

        .btn {
            padding: var(--space-xs) var(--space-md);
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-light);
            border-color: var(--accent-primary);
        }

        .btn:focus {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .btn-danger {
            background: var(--accent-secondary);
            color: white;
            border-color: var(--accent-secondary);
        }

        /* Error message */
        .error-message {
            font-size: var(--text-lg);
            color: var(--text-secondary);
            margin-bottom: var(--space-lg);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* Redirect counter - positioned at bottom */
        .redirect-info {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: var(--space-md);
            margin-top: var(--space-xl);
            font-size: var(--text-sm);
            animation: fadeInUp 0.8s ease-out 0.4s both;
            width: 100%;
            max-width: 500px;
        }

        .redirect-counter {
            font-size: var(--text-base);
            font-weight: 500;
            color: var(--accent-primary);
            margin-bottom: var(--space-xs);
        }

        .redirect-controls {
            display: flex;
            gap: var(--space-xs);
            justify-content: center;
            margin-top: var(--space-xs);
        }

        .btn-small {
            padding: var(--space-xs) var(--space-sm);
            font-size: var(--text-xs);
        }

        /* Search box */
        .search-container {
            max-width: 400px;
            width: 100%;
            margin-bottom: var(--space-lg);
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .search-box {
            display: flex;
            gap: var(--space-xs);
        }

        .search-input {
            flex: 1;
            padding: var(--space-sm);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: var(--text-base);
        }

        .search-input:focus {
            outline: 2px solid var(--accent-primary);
            outline-offset: -2px;
            border-color: var(--accent-primary);
        }

        /* Footer */
        footer {
            padding: var(--space-md);
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .developer-credit {
            margin-top: var(--space-xs);
        }

        /* Reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .error-card::before {
                animation: none;
            }
        }

        /* Responsive design */
        @media (max-width: 640px) {
            .error-card {
                padding: var(--space-lg);
                margin: 0 var(--space-sm) var(--space-lg);
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                justify-content: center;
            }
            
            .redirect-info {
                margin: var(--space-lg) var(--space-sm) 0;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                color: black;
            }
            
            .theme-toggle,
            .redirect-info,
            .search-container,
            .action-buttons .btn:not(.btn-primary) {
                display: none;
            }
            
            .error-card {
                box-shadow: none;
                border: 1px solid #ccc;
            }
            
            main::after {
                content: "Please visit https://chril.xyz to return to the homepage.";
                display: block;
                margin-top: 2rem;
                font-size: 14px;
                color: #666;
            }
        }

        /* Focus styles for keyboard navigation */
        :focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        /* Hidden text for screen readers */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>
    <!-- Skip link for accessibility -->
    <a href="#main" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header>
        <div></div>
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
            <span id="theme-icon">🌙</span>
        </button>
    </header>

    <!-- Main content -->
    <main id="main">
        <div class="error-card">
            <!-- Hand-drawn 404 like in reference -->
            <div class="error-number">404</div>
            
            <!-- Error message -->
            <div class="error-message-card">
                <h2>الصفحة غير موجودة</h2>
                <p>عذراً، الصفحة التي تبحث عنها غير متوفرة</p>
                <p>Sorry, the page you're looking for doesn't exist</p>
            </div>

            <!-- Action buttons inspired by reference image buttons -->
            <div class="action-buttons">
                <a href="https://chril.xyz" class="btn btn-primary" rel="noopener" target="_self">
                    🏠 Home
                </a>
                <button class="btn" id="snake-btn">
                    🐍 Snake
                </button>
                <a href="https://instagram.com/chril.exe" class="btn" target="_blank" rel="noopener">
                    📱 Social
                </a>
            </div>
        </div>

        <!-- Redirect information - MOVED TO BOTTOM -->
        <div class="redirect-info" aria-live="polite">
            <div class="redirect-counter" id="redirect-counter">
                Redirecting to home in <span id="countdown">10</span> seconds
            </div>
            <div class="redirect-controls">
                <button class="btn btn-small" id="cancel-redirect">Cancel</button>
                <button class="btn btn-primary btn-small" id="resume-redirect" style="display: none;">Resume</button>
            </div>
        </div>

        <!-- Snake Game Modal -->
        <div id="snake-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: var(--bg-secondary); border-radius: 15px; padding: var(--space-lg); max-width: 500px; width: 90%; text-align: center;">
                <h2 style="margin-bottom: var(--space-md);">🐍 Snake Game</h2>
                <canvas id="snake-canvas" width="300" height="300" style="border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-primary);"></canvas>
                <div style="margin-top: var(--space-md);">
                    <p>Score: <span id="snake-score">0</span></p>
                    <p style="font-size: var(--text-xs); margin: var(--space-xs) 0;">Use arrow keys to play</p>
                    <div style="display: flex; gap: var(--space-sm); justify-content: center; margin-top: var(--space-md);">
                        <button class="btn btn-primary" id="restart-snake">Restart</button>
                        <button class="btn" id="close-snake">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div>
            <a href="https://chril.xyz" rel="noopener" target="_self">Return to chril.xyz</a>
        </div>
        <div class="developer-credit">
            <small>Made by <span rel="author">chril_exe</span></small>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        // Constants
        const HOME_URL = 'https://chril.xyz';
        
        // State management
        let redirectTimer = null;
        let redirectTimeLeft = 10;
        let redirectActive = true;
        
        // DOM elements
        const elements = {
            themeToggle: document.getElementById('theme-icon'),
            countdown: document.getElementById('countdown'),
            cancelBtn: document.getElementById('cancel-redirect'),
            resumeBtn: document.getElementById('resume-redirect'),
            snakeBtn: document.getElementById('snake-btn'),
            snakeModal: document.getElementById('snake-modal'),
            snakeCanvas: document.getElementById('snake-canvas'),
            snakeScore: document.getElementById('snake-score'),
            restartSnake: document.getElementById('restart-snake'),
            closeSnake: document.getElementById('close-snake')
        };

        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const currentTheme = savedTheme || systemTheme;
            
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon(currentTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            updateThemeIcon(newTheme);
            
            try {
                localStorage.setItem('theme', newTheme);
            } catch (e) {
                console.log('Unable to save theme preference');
            }
        }

        function updateThemeIcon(theme) {
            if (elements.themeToggle) {
                elements.themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        // Redirect functionality
        function startRedirectTimer() {
            if (!redirectActive) return;
            
            redirectTimer = setInterval(() => {
                redirectTimeLeft--;
                
                if (elements.countdown) {
                    elements.countdown.textContent = redirectTimeLeft;
                }
                
                if (redirectTimeLeft <= 0) {
                    clearInterval(redirectTimer);
                    // Error telemetry hook - would send data if enabled
                    // logErrorTelemetry();
                    window.location.href = HOME_URL;
                }
            }, 1000);
        }

        function cancelRedirect() {
            redirectActive = false;
            clearInterval(redirectTimer);
            
            if (elements.cancelBtn) elements.cancelBtn.style.display = 'none';
            if (elements.resumeBtn) elements.resumeBtn.style.display = 'inline-block';
            
            const counter = document.getElementById('redirect-counter');
            if (counter) {
                counter.innerHTML = 'Redirect cancelled';
            }
        }

        function resumeRedirect() {
            redirectActive = true;
            redirectTimeLeft = 10;
            
            if (elements.cancelBtn) elements.cancelBtn.style.display = 'inline-block';
            if (elements.resumeBtn) elements.resumeBtn.style.display = 'none';
            
            const counter = document.getElementById('redirect-counter');
            if (counter) {
                counter.innerHTML = 'Redirecting in <span id="countdown">10</span>s';
                elements.countdown = document.getElementById('countdown');
            }
            
            startRedirectTimer();
        }

        // Search functionality
        function handleSearch(event) {
            event.preventDefault();
            
            const query = elements.searchInput?.value?.trim();
            if (!query) return;
            
            // Sanitize input - remove potentially harmful characters
            const sanitizedQuery = query.replace(/[<>\"'&]/g, '');
            
            if (sanitizedQuery) {
                const searchUrl = `${HOME_URL}/?s=${encodeURIComponent(sanitizedQuery)}`;
                window.location.href = searchUrl;
            }
        }

        // Error telemetry (stub for future implementation)
        function logErrorTelemetry() {
            // This would send error data to an endpoint if enabled
            const telemetryData = {
                url: window.location.href,
                referrer: document.referrer,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };
            
            // console.log('Error telemetry data:', telemetryData);
            // In a real implementation, this would POST to an analytics endpoint
        }

        // Snake Game - Fixed version
        let snake = [];
        let direction = {x: 0, y: 0};
        let food = {};
        let score = 0;
        let gameRunning = false;
        let gameInterval = null;
        let ctx = null;

        function initSnakeGame() {
            const canvas = elements.snakeCanvas;
            if (!canvas) return;
            
            ctx = canvas.getContext('2d');
            
            // Reset game state
            snake = [
                {x: 160, y: 160},
                {x: 140, y: 160},
                {x: 120, y: 160}
            ];
            direction = {x: 20, y: 0}; // Start moving right
            score = 0;
            gameRunning = true;
            
            generateFood();
            updateScore();
            
            // Clear any existing interval
            if (gameInterval) clearInterval(gameInterval);
            
            // Start game loop
            gameInterval = setInterval(gameLoop, 200);
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * 15) * 20,
                    y: Math.floor(Math.random() * 15) * 20
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            
            food = newFood;
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            moveSnake();
            if (checkCollisions()) {
                gameOver();
                return;
            }
            checkFood();
            draw();
        }

        function moveSnake() {
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            snake.unshift(head);
        }

        function checkCollisions() {
            const head = snake[0];
            
            // Check wall collision
            if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300) {
                return true;
            }
            
            // Check self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function checkFood() {
            const head = snake[0];
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function draw() {
            if (!ctx) return;
            
            // Clear canvas
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim();
            ctx.fillRect(0, 0, 300, 300);
            
            // Draw snake
            ctx.fillStyle = '#4CAF50'; // Green color for snake
            snake.forEach(segment => {
                ctx.fillRect(segment.x + 1, segment.y + 1, 18, 18);
            });
            
            // Draw snake head differently
            ctx.fillStyle = '#2E7D32'; // Darker green for head
            ctx.fillRect(snake[0].x + 1, snake[0].y + 1, 18, 18);
            
            // Draw food
            ctx.fillStyle = '#F44336'; // Red color for food
            ctx.fillRect(food.x + 1, food.y + 1, 18, 18);
            
            // Draw grid lines (optional)
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-color').trim();
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 300; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 300);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(300, i);
                ctx.stroke();
            }
        }

        function updateScore() {
            if (elements.snakeScore) {
                elements.snakeScore.textContent = score;
            }
        }

        function gameOver() {
            gameRunning = false;
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            
            // Draw game over message
            if (ctx) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, 300, 300);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', 150, 140);
                
                ctx.font = '16px Arial';
                ctx.fillText(`Final Score: ${score}`, 150, 170);
                ctx.fillText('Click Restart to play again', 150, 190);
            }
        }

        function handleSnakeKeys(event) {
            if (!gameRunning) return;
            
            const key = event.key;
            
            // Prevent snake from going backwards into itself
            switch(key) {
                case 'ArrowUp':
                    if (direction.y !== 20) { // Not moving down
                        direction = {x: 0, y: -20};
                        event.preventDefault();
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y !== -20) { // Not moving up
                        direction = {x: 0, y: 20};
                        event.preventDefault();
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 20) { // Not moving right
                        direction = {x: -20, y: 0};
                        event.preventDefault();
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x !== -20) { // Not moving left
                        direction = {x: 20, y: 0};
                        event.preventDefault();
                    }
                    break;
                case 'Escape':
                    closeSnakeGame();
                    event.preventDefault();
                    break;
            }
        }

        function openSnakeGame() {
            if (elements.snakeModal) {
                elements.snakeModal.style.display = 'flex';
                setTimeout(() => {
                    initSnakeGame();
                    document.addEventListener('keydown', handleSnakeKeys);
                }, 100);
            }
        }

        function closeSnakeGame() {
            if (elements.snakeModal) {
                elements.snakeModal.style.display = 'none';
                gameRunning = false;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                document.removeEventListener('keydown', handleSnakeKeys);
            }
        }

        // Page visibility handling for performance
        function handleVisibilityChange() {
            if (document.hidden) {
                // Pause timers when tab is hidden
                if (redirectTimer && redirectActive) {
                    clearInterval(redirectTimer);
                }
            } else {
                // Resume timers when tab is visible
                if (redirectActive && redirectTimeLeft > 0) {
                    startRedirectTimer();
                }
            }
        }

        // Event listeners
        function initEventListeners() {
            // Theme toggle
            if (elements.themeToggle?.parentElement) {
                elements.themeToggle.parentElement.addEventListener('click', toggleTheme);
            }
            
            // Redirect controls
            if (elements.cancelBtn) {
                elements.cancelBtn.addEventListener('click', cancelRedirect);
            }
            if (elements.resumeBtn) {
                elements.resumeBtn.addEventListener('click', resumeRedirect);
            }
            
            // Search (keeping function but no longer needed)
            if (elements.searchForm) {
                elements.searchForm.addEventListener('submit', handleSearch);
            }
            
            // Snake game controls
            if (elements.snakeBtn) {
                elements.snakeBtn.addEventListener('click', openSnakeGame);
            }
            if (elements.closeSnake) {
                elements.closeSnake.addEventListener('click', closeSnakeGame);
            }
            if (elements.restartSnake) {
                elements.restartSnake.addEventListener('click', () => {
                    if (gameInterval) clearInterval(gameInterval);
                    initSnakeGame();
                });
            }
            
            // Page visibility for performance
            document.addEventListener('visibilitychange', handleVisibilityChange);
            
            // System theme changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    updateThemeIcon(newTheme);
                }
            });
        }

        // Initialization
        function init() {
            initTheme();
            initEventListeners();
            
            // Start redirect timer if JavaScript is enabled
            setTimeout(() => {
                if (redirectActive) {
                    startRedirectTimer();
                }
            }, 1000); // Give page a moment to load
            
            // Log page load for telemetry (disabled by default)
            // logErrorTelemetry();
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (redirectTimer) {
                clearInterval(redirectTimer);
            }
        });
    </script>
</body>
</html>
