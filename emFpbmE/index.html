<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عيد ميلاد سعيد!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f2fa;
      color: #2e1345;
      text-align: center;
    }
    header {
      position: relative;
      background: linear-gradient(135deg, #a06ddb, #6b2fa1);
      color: white;
      padding: 60px 20px;
    }
    header h1 {
      font-size: 3rem;
      margin: 0.5rem 0;
      letter-spacing: 2px;
    }
    header p {
      font-size: 1.2rem;
    }
    .birthday-date {
      font-weight: bold;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    footer {
      margin: 40px 0;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>

<header>
  <h1>عيد ميلاد سعيد يا زينة</h1>
  <p>بتاريخ <span class="birthday-date">24 سبتمبر</span></p>
</header>

<section class="gallery">
  <!-- أماكن مخصصة لإضافة صورك -->
  <img src="YOUR_IMAGE1_URL" alt="ذكرى صور">
  <img src="YOUR_IMAGE2_URL" alt="ذكريات حلوة">
  <img src="YOUR_IMAGE3_URL" alt="صورة جميلة">
  <img src="YOUR_IMAGE4_URL" alt="لحظة مميزة">
</section>

<footer>
  <p>نتمنى لكِ سنة جديدة مليانة سعادة وأحلام تتحقق!</p>
</footer>

</body>
</html>
